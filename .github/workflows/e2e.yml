name: E2E Pairing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run pairing E2E on two emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 33+ is required: KeyManager uses setUserAuthenticationParameters()
          # on API 30+ so CryptoObject correctly unlocks the time-bound keystore
          # key. API 28 uses the legacy setUserAuthenticationValidityDurationSeconds
          # path which fails cipher.init() before BiometricPrompt ever shows.
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_6
          force-avd-creation: true
          # -read-only is required so the second emulator can share the same AVD.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -read-only
          disable-animations: true
          script: bash ./scripts/ci-e2e-pairing.sh

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pairing-artifacts
          path: |
            /tmp/e2e-fail-*.png
            /tmp/emulator-5556.log
          if-no-files-found: ignore
          retention-days: 14
