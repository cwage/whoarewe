name: E2E Pairing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Matrix the e2e across the legacy/modern Keystore-auth boundary:
        # API 28 exercises the `setUserAuthenticationValidityDurationSeconds`
        # path (cipher init has to happen *after* BiometricPrompt refreshes
        # the auth window), API 33 exercises the `setUserAuthenticationParameters`
        # path (cipher init happens up front and the prompt unlocks via
        # CryptoObject). Both must stay green; cwage/whoarewe#6 was the bug
        # where the legacy path was broken end-to-end.
        api-level: [28, 33]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run pairing E2E on two emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_6
          force-avd-creation: true
          # -read-only is required so the second emulator can share the same AVD.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -read-only
          disable-animations: true
          script: bash ./scripts/ci-e2e-pairing.sh

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pairing-artifacts-api${{ matrix.api-level }}
          path: |
            /tmp/e2e-fail-*.png
            /tmp/emulator-5556.log
          if-no-files-found: ignore
          retention-days: 14
