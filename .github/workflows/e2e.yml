name: E2E Pairing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run pairing E2E on two emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euxo pipefail

            # The runner already booted emulator-5554. Launch a second one on
            # port 5556 in the background using the same AVD definition the
            # runner created.
            AVD=$(emulator -list-avds | head -1)
            echo "[e2e] using AVD: $AVD"

            nohup emulator -avd "$AVD" \
                -port 5556 \
                -no-snapshot-save -no-window -gpu swiftshader_indirect \
                -noaudio -no-boot-anim -read-only \
                > /tmp/emulator-5556.log 2>&1 &

            adb -s emulator-5556 wait-for-device
            # Wait until the second device finishes booting.
            for i in $(seq 1 180); do
              val=$(adb -s emulator-5556 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$val" = "1" ]; then break; fi
              sleep 1
            done
            adb devices

            ./scripts/e2e-pairing.sh emulator-5554 emulator-5556

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pairing-artifacts
          path: |
            /tmp/e2e-fail-*.png
            /tmp/emulator-5556.log
          if-no-files-found: ignore
          retention-days: 14
