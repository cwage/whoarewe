name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        api-level: [28]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK and test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14

  maestro-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: instrumented-tests

    # This job runs the maestro flows via the same `androidtest` docker image
    # used for local iteration (`scripts/local-maestro.sh`). Same Dockerfile,
    # same compose service, same wrapper script — no `reactivecircus/android-
    # emulator-runner`, no separately-installed maestro CLI. Whatever passes
    # locally passes here, and vice versa. cwage/whoarewe#13.
    #
    # NOTE: only setup-identity.yaml is run here. pair-wizard-navigation.yaml
    # depends on a debug intent (`e2e_create_identity`) that bootstraps an
    # identity without going through BiometricPrompt — that intent and its
    # bootstrap orchestration land in cwage/whoarewe#12, which will re-add
    # pair-wizard-navigation to this job.

    steps:
      - uses: actions/checkout@v4

      # Make /dev/kvm world-writable so the dockerized androidtest container
      # (running as a non-root UID) can access it via the compose `devices:`
      # passthrough. Same udev trick the e2e workflow uses.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build androidtest docker image
        run: docker compose build androidtest

      - name: Run maestro flows in container
        run: docker compose run --rm androidtest scripts/local-maestro.sh .maestro/setup-identity.yaml

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          # local-maestro.sh copies the container's ~/.maestro/tests dir into
          # ./.maestro-results inside the bind-mounted project on every run
          # (success or failure), so this picks them up regardless.
          path: .maestro-results/
          if-no-files-found: ignore
          retention-days: 14
