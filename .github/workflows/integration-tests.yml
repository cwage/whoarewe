name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        api-level: [28]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK and test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 14

  maestro-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: instrumented-tests

    # This job runs the maestro flows via the same `androidtest` docker image
    # used for local iteration (`scripts/local-maestro.sh`). Same Dockerfile,
    # same compose service, same wrapper script — no `reactivecircus/android-
    # emulator-runner`, no separately-installed maestro CLI. Whatever passes
    # locally passes here, and vice versa. cwage/whoarewe#13.
    #
    # Both flows run in a single container session: setup-identity.yaml on a
    # fresh app state, then `--bootstrap-identity TestUser` fires the
    # `e2e_create_identity` debug intent (cwage/whoarewe#11) so the vm
    # transitions into the contact list, then pair-wizard-navigation.yaml
    # walks the wizard from there. All in one emulator boot.

    steps:
      - uses: actions/checkout@v4

      # Make /dev/kvm world-writable so the dockerized androidtest container
      # (running as a non-root UID) can access it via the compose `devices:`
      # passthrough. Same udev trick the e2e workflow uses.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build androidtest docker image
        run: docker compose build androidtest

      - name: Run maestro flows in container
        # HOST_UID / HOST_GID match the runner so the container user can
        # write into the bind-mounted project (notably the gradle build
        # output and the .maestro-results dir). KVM_GID picks up the
        # runner's `kvm` group GID — varies by distro / runner image,
        # so we discover it dynamically rather than hardcoding.
        #
        # Defensive fallback on KVM_GID: `getent` can return an empty
        # string if the kvm group is missing or getent itself fails, and
        # compose's `${KVM_GID:-109}` only defaults when the var is
        # *unset*, not when it's set to "". So we only export if non-empty
        # and let compose's own default handle the rest.
        run: |
          export HOST_UID=$(id -u)
          export HOST_GID=$(id -g)
          KVM_GID_VALUE=$(getent group kvm | cut -d: -f3 || true)
          if [[ -n "${KVM_GID_VALUE}" ]]; then
            export KVM_GID="${KVM_GID_VALUE}"
          fi
          docker compose run --rm androidtest scripts/local-maestro.sh \
            .maestro/setup-identity.yaml \
            --bootstrap-identity TestUser \
            .maestro/pair-wizard-navigation.yaml

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          # local-maestro.sh copies the container's ~/.maestro/tests dir into
          # ./.maestro-results inside the bind-mounted project on every run
          # (success or failure), so this picks them up regardless.
          path: .maestro-results/
          if-no-files-found: ignore
          retention-days: 14
