appId: com.whoarewe.app
name: "Add Contact Navigation"
tags:
  - wizard
  - navigation
---

# Assumes identity has already been bootstrapped via the
# `e2e_create_identity` debug intent in the workflow. See
# `.github/workflows/integration-tests.yml` for the orchestration:
# the workflow does `adb shell am start ... --es e2e_create_identity
# TestUser` immediately before invoking this flow, which writes a
# valid public key + sentinel encrypted blob + Identity row, so the
# vm transitions straight into the contact list state on launch.
#
# launchApp here (without clearState) brings the existing app process
# to foreground without wiping the bootstrapped state on disk.
- launchApp:
    clearState: false

# From the contact list, tap the pair button. Maestro's `id:` selector
# matches accessibility resource-id, which Compose icons don't have —
# `"Pair with someone"` is the `contentDescription` of the IconButton's
# Icon, exposed in the accessibility tree as content-desc, not id. Use
# the short-form `tapOn` which matches text OR content-description.
- tapOn: "Pair with someone"

# Should see the add-contact scan step (cwage/whoarewe#49: simplified
# from the old five-step "who goes first" wizard)
- assertVisible: "Scan a contact's QR code"
- assertVisible: "Scan with camera"
- assertVisible: "Import from image"

# Go back to contacts via the navigation back arrow.
- tapOn: "Back"

# Verify we're back on the contact list. Use the app-bar title rather
# than identity bar text, because the identity bar's clickable Row
# merges its descendant semantics on some API levels.
- assertVisible: "WhoAreWe"
- assertVisible: "No trusted contacts yet"
